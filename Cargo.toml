[package]
name = "griffin"
version = "0.1.0"
edition = "2024"
description = "A non-modal TUI text editor"

[[bin]]
name = "griffin"
path = "src/main.rs"

[dependencies]
ansi-to-tui = "8"
anyhow = "1"
arboard = { version = "3", default-features = false }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
ignore = "0.4"
lsp-types = "0.97"
nucleo = "0.5"
ratatui = "0.30"
regex = "1"
ropey = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streaming-iterator = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
toml = "1"
trash = "5"
tree-sitter = "0.27"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-highlight = "0.27"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-sequel = "0.3"
tree-sitter-typescript = "0.23"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3"
vt100 = "0.16"
