[package]
name = "griffin"
version = "0.1.0"
edition = "2024"
description = "A non-modal TUI text editor"

[[bin]]
name = "griffin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
ignore = "0.4"
nucleo = "0.5"
ratatui = "0.30"
regex = "1"
ropey = "1"
serde = { version = "1", features = ["derive"] }
streaming-iterator = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1"
trash = "5"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
unicode-width = "0.2"

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3"
vt100 = "0.16"
