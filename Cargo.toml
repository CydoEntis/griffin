[package]
name = "griffin"
version = "0.1.0"
edition = "2024"
description = "A non-modal TUI text editor"

[[bin]]
name = "griffin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.30"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
